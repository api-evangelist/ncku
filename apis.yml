aid: ncku
name: National Cheng Kung University
x-type: university
x-category: Public Research University
description: >-
  National Cheng Kung University (NCKU, 國立成功大學) is a public research university in Tainan,
  Taiwan, founded in 1931 and the second-largest comprehensive university in the country. Its
  programmable footprint is narrow and almost entirely accounted for by one surface: the NCKU Open
  Data Platform at data.ncku.edu.tw, a CKAN 2.0 deployment NCKU runs on its own host and its own
  domain, carrying 108 datasets and two NCKU-authored CKAN extensions (nckumetadata,
  nckutemplatehelper), released under Taiwan's Open Government Data License v1. Its Action API
  answers anonymous callers with valid JSON and is the only endpoint in this profile that returns
  machine-readable institutional data without credentials. Everything else is either a vendor
  tenancy or barely reachable. Library discovery is Ex Libris Primo VE under an NCKU tenant view
  (886NCKU_INST) and is recorded as a relationship, not as NCKU's engineering — no Ex Libris
  contract is saved here. The NCKU institutional repository (NCKUR) at nckur.lib.ncku.edu.tw is
  NCKU's own DSpace, confirmed live and self-identifying as "Powered By DSPACE, MIT" Version 7.0
  during one of only three responsive windows in roughly thirty probes on 2026-09-01 — the host
  refuses TCP the rest of the time. No OAI-PMH or REST interface survived probing:
  /oai/request?verb=Identify returns a genuine 404 and every other candidate path fell inside a
  refusal window, so the 2026-06 profile's DSpace REST and OAI-PMH claims stay unverified. NCKU's Shibboleth identity provider
  resolves in DNS at idp.ncku.edu.tw but its ports do not answer from outside Taiwan, and Taiwan has
  no federation in eduGAIN, so the IdP is named as an unverified lead rather than credited as a
  surface. NCKU registers no DOI prefix with either DataCite or Crossref. There is no central
  developer portal, no API key program and no institution-authored OpenAPI anywhere on the
  ncku.edu.tw estate.
