x-coverage:
  state: covered
  reason: covered
  detail: >-
    NCKU was reachable and one genuine institution-operated machine-readable surface was verified:
    the CKAN Action API at data.ncku.edu.tw answers status_show, site_read, package_list and
    package_show anonymously with valid JSON, reporting ckan_version 2.0, site_title "National Cheng
    Kung University Open Data Platform" and two NCKU-specific extensions, over 108 datasets. That
    deployment is NCKU's — their host, their data, their extensions — but the contract behind it is
    CKAN's product API, shared by every CKAN site in the world, so no OpenAPI is saved under NCKU's
    name and the CKAN project's own documentation is linked instead. The 2026-06 profile's three
    other claims did not survive probing. Library discovery is not on www.lib.ncku.edu.tw at all:
    the library site links out to ncku.primo.exlibrisgroup.com with view 886NCKU_INST, which is an
    Ex Libris Primo VE tenancy and is re-labelled x-operator tenant here. The institutional
    repository is real and is NCKU's, but its host is barely reachable: it refused TCP on 443 and 80
    on most of roughly thirty attempts and a direct nc port check timed out, while returning a full
    200 three times — enough to confirm DSpace, nginx/1.18.0 and handle prefix 987654321, and enough
    to establish that /oai/request?verb=Identify is a genuine application 404. The 2026-06 claim of
    a DSpace 7 REST API and OAI-PMH interface is left unverified rather than restated. One early
    fetch returned a "Website Moved" interstitial pointing at mytheses.my; it is recorded as an
    anomaly on the enhancing vendor's stack, not as a migration. Searches were run in Traditional Chinese as well as
    English, which is how the generative-AI academic integrity guideline and the NCKU AI learning
    resource site were found — both institution-published governance surfaces, neither an API.
    Negative registry findings are recorded deliberately: api.datacite.org returns zero clients for
    "cheng kung" and "ncku", api.crossref.org returns zero members, and eduGAIN lists no Taiwanese
    federation, so the only registry membership evidenced is ROR 01b8kcc49.
