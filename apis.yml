  - aid: ncku:library-discovery
    name: NCKU Library discovery (Ex Libris Primo VE tenancy)
    x-operator: tenant
    x-operator-evidence: >-
      www.lib.ncku.edu.tw is NCKU's own library website, but every discovery, account and course
      reserves link on it points at ncku.primo.exlibrisgroup.com with view 886NCKU_INST — an
      institution-specific view on Ex Libris's shared multi-tenant Primo VE platform. The 2026-06
      profile recorded this surface against the institution's own library host, which is what the
      host-based verdict saw; the service itself is Ex Libris's. Corrected to tenant.
    description: >-
      NCKU Library's catalog and discovery layer runs on Ex Libris Primo VE backed by Alma, under the
      NCKU tenant view 886NCKU_INST. The search interface is a Primo Angular application
      (primoExploreRoot) served from ncku.primo.exlibrisgroup.com and returns 200 to an anonymous
      request. The collection, the holdings and the course reserves are NCKU's; the contract, the
      platform and the API surface are Ex Libris's, and no Ex Libris specification is saved under
      NCKU's name. No NCKU-specific Primo/Alma developer documentation, API key program or published
      REST base URL was found. NCKU also runs a RapidILL interlibrary loan service at
      rapidill.lib.ncku.edu.tw, a second Ex Libris tenancy.
    humanURL: https://ncku.primo.exlibrisgroup.com/discovery/search?vid=886NCKU_INST:886NCKU_INST&lang=zh-tw
    tags: [ Library, Primo, Alma, Ex Libris, Discovery, Tenant ]
    x-probe:
      probed: '2026-09-01'
      humanURL_status: 200
      library_site: https://www.lib.ncku.edu.tw/
      library_site_status: 200
      note: >-
        humanURL deliberately names the Ex Libris tenant host rather than NCKU's own library site,
        so the cohort's host-based audit reaches the same verdict this entry records. Pointing it at
        www.lib.ncku.edu.tw is what made the 2026-06 profile read as institution-operated.
    properties:
      - type: LibraryCatalog
        url: https://ncku.primo.exlibrisgroup.com/discovery/search?vid=886NCKU_INST:886NCKU_INST&lang=zh-tw
      - type: Website
