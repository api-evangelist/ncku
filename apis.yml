apis:
  - aid: ncku:opendata
    name: NCKU Open Data Platform (CKAN Action API)
    x-operator: institution
    x-operator-evidence: >-
      data.ncku.edu.tw is under NCKU's own registrable domain (ncku.edu.tw) and resolves to
      140.116.249.41, inside NCKU's own 140.116.0.0/16 allocation. status_show reports site_url
      https://data.ncku.edu.tw, an ncku.edu.tw contact address, and two extensions named for the
      institution — nckumetadata and nckutemplatehelper. The cohort audit flags that the name CNAMEs to
      data.ncku.com.tw; that target resolves to the same 140.116.249.41, so ncku.com.tw is a second
      NCKU-controlled name in front of the same NCKU-hosted server, not a vendor platform — it is
      merely delegated to Cloudflare nameservers while ncku.edu.tw runs on NCKU's own
      apple/name.ncku.edu.tw, which is the only reason the two look unrelated. NCKU operates the
      server and authored the customisation; the Action API contract itself is CKAN's product API, which is why no OpenAPI
      is saved under NCKU's name.
    description: >-
      NCKU's institutional open data portal, a CKAN 2.0 deployment on NCKU's own host publishing 108
      datasets from the university and its affiliated units — student enrolment and geographic
      distribution statistics, international student counts, and the Smart University City (智慧大學城)
      education and energy datasets. The standard CKAN Action API is open and anonymous:
      /api/3/action/package_list returns the full dataset id list, /api/3/action/package_show returns
      full dataset metadata with resources, and /api/3/action/status_show confirms ckan_version 2.0
      with the datastore, stats, recline_preview, json_preview, pdf_preview and resource_proxy
      extensions enabled alongside NCKU's own two. Data is released under Taiwan's Open Government
      Data License v1 (政府資料開放授權條款第1版), which the portal states is compatible with CC BY 4.0.
      robots.txt disallows /api/ to crawlers, which is a courtesy directive rather than an access
      control — the endpoints answer normally.
    humanURL: https://data.ncku.edu.tw/
    baseURL: https://data.ncku.edu.tw/api/3/action
    tags: [ Open Data, CKAN, Datasets, JSON, Taiwan, Research Data ]
    x-probe:
      probed: '2026-09-01'
      baseURL_status: 200
      humanURL_status: 200
      datasets: 108
      ckan_version: '2.0'
    properties:
      - type: Documentation
        url: https://docs.ckan.org/en/latest/api/
      - type: OpenData
        url: https://data.ncku.edu.tw/
      - type: TermsOfService
