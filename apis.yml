  - aid: ncku:institutional-repository
    name: NCKU Institutional Repository (NCKUR, DSpace)
    x-operator: institution
    x-operator-evidence: >-
      nckur.lib.ncku.edu.tw is under NCKU's own registrable domain and resolves to 140.116.207.17,
      inside NCKU's own 140.116.0.0/16 allocation, adjacent to the library web server at
      140.116.207.18. The served page identifies itself as 國立成功大學機構典藏 (NCKU Institutional
      Repository) and its internal origin is 140.116.207.99, also NCKU's. The repository is NCKU's;
      the software is DSpace, which is why no product contract is saved under NCKU's name.
    description: >-
      NCKUR is NCKU's institutional repository — theses, dissertations and university scholarly
      output under handle prefix 987654321, with roughly 294 handle links on the front page alone.
      It self-identifies as "Powered By DSPACE, MIT", Version 7.0, served by nginx/1.18.0 on Ubuntu,
      with a locally enhanced JSPUI-style interface (/feed/rss_1.0/, /feed/rss_2.0/,
      /feedback?fromPage=). The host is severely unstable from outside Taiwan: across roughly thirty
      probes on 2026-09-01 it refused TCP on 443 and 80 the large majority of the time and a direct
      nc port check timed out, but it did return a full 200 (92,896 bytes) three times, and one of
      those windows was long enough to confirm the software. No harvesting or REST interface could
      be confirmed: /oai/request?verb=Identify returns a genuine application 404, and
      /server/oai/request, /dspace-oai/request, /server/api and /rest were never reachable within a
      responsive window. The 2026-06 profile's assertion of a DSpace 7 REST API and OAI-PMH
      interface is therefore still unverified and is not claimed here. One anomaly is on the record:
      a single early fetch returned a 1,616-byte "Our Website Has Moved" interstitial counting down
      to mytheses.my, an off-institution destination, which is most likely the enhancing vendor's
      default virtual host leaking through rather than a migration of NCKU's repository.
    humanURL: https://nckur.lib.ncku.edu.tw/
    tags: [ Institutional Repository, DSpace, Research, Theses, Taiwan ]
    x-probe:
      probed: '2026-09-01'
      humanURL_status: 200
      humanURL_note: >-
        intermittent — 200/92896 on 3 of ~30 attempts, ECONNREFUSED or connection timeout on the
        rest; software confirmed as DSpace during a responsive window
      oai_candidate: https://nckur.lib.ncku.edu.tw/oai/request?verb=Identify
      oai_status: 404
    properties:
      - type: ResearchRepository
        url: https://nckur.lib.ncku.edu.tw/

  - aid: ncku:ror-registration
    name: ROR organization record (01b8kcc49)
    x-operator: registry
    x-operator-evidence: >-
      api.ror.org is a shared organization registry every institution is registered in by
      definition; record 01b8kcc49 is NCKU's. The registry's own contract is not saved here — only
      the membership, which is a fact about NCKU.
    x-registrant-id: 01b8kcc49
    description: >-
      NCKU's Research Organization Registry record — ror.org/01b8kcc49, established 1931, status
      active, declared domain ncku.edu.tw — and the canonical machine-readable identifier for the
      institution itself. It carries Crossref Funder ID (fundref) 501100007750, GRID grid.64523.36,
      ISNI 0000 0004 0532 3255 and Wikidata Q706708. This is the only identifier-registry membership
      that could be evidenced for NCKU: api.datacite.org returns zero clients for both "cheng kung"
      and "ncku", and api.crossref.org returns zero members, so NCKU registers no DOI prefix with
      either — its scholarly DOIs, where they exist, are minted elsewhere. The affiliated NCKU
      Hospital holds a separate ROR record, 04zx3rq17.
    humanURL: https://ror.org/01b8kcc49
    baseURL: https://api.ror.org/organizations/01b8kcc49
    tags: [ Registry, ROR, Identifiers, Research, Organization ]
    x-probe:
      probed: '2026-09-01'
      baseURL_status: 200
      humanURL_status: 200

