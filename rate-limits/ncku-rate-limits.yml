description: >-
  National Cheng Kung University publishes no rate-limit table for any of its surfaces. The one
  institution-operated machine-readable endpoint verified on 2026-09-01 — the CKAN Action API at
  data.ncku.edu.tw — answered anonymous calls without throttling and declares no documented limit;
  data.ncku.edu.tw/robots.txt asks crawlers for a 10-second delay and disallows /api/, which is a
  politeness directive rather than an enforced control. No OAI-PMH, IIIF or library harvesting
  endpoint was reachable, so no limit is asserted for any of them.
notes: Confirm per-service limits with each API's documentation; harvest responsibly.
