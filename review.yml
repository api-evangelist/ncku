  - date: '2026-06-03'
    rating: 3
    summary: >-
      NCKU has no single consolidated developer portal, but it operates real,
      live machine-readable interfaces. The CKAN open data platform was verified
      live returning valid CKAN Action API JSON (150+ dataset IDs from
      package_list). The library discovery layer runs on Ex Libris Primo/Alma
      and the institutional repository on DSpace 7, both verified live. No
      NCKU-branded API key program or developer docs were found, and a working
      OAI-PMH/REST base URL for the DSpace repository did not resolve at probe
      time, so it was not asserted. No endpoints were fabricated.
