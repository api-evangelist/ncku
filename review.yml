  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-profiled under the university pipeline, which settles WHO OPERATES each surface before
      saving anything. Three corrections to the 2026-06 review. (1) Library discovery was recorded
      against NCKU's own library host; it is not NCKU's service. Every discovery, account and course
      reserves link on www.lib.ncku.edu.tw points at ncku.primo.exlibrisgroup.com with view
      886NCKU_INST, an institution-specific view on Ex Libris's shared Primo VE platform. Re-labelled
      x-operator tenant; no Ex Libris contract is saved under NCKU's name. (2) The institutional
      repository was recorded as live at 200; it is real and it is NCKU's DSpace, but the host
      refused TCP on 443 and 80 on most of roughly thirty attempts. Three responsive windows were
      enough to confirm "Powered By DSPACE, MIT" Version 7.0 on nginx/1.18.0 and handle prefix
      987654321, and to establish that /oai/request?verb=Identify is a genuine application 404. The
      DSpace REST and OAI-PMH claims remain unverified and are not asserted. (3) package_list now
      returns 108 dataset identifiers, not the 150+ recorded in June. Added: NCKU's ROR registration
      01b8kcc49 as a registry membership, with the negative findings that api.datacite.org lists zero
      clients and api.crossref.org zero members for NCKU, so it registers no DOI prefix with either.
      idp.ncku.edu.tw resolves but answers on no port from outside Taiwan and Taiwan has no eduGAIN
      federation, so the Shibboleth IdP is named as a lead, not credited as a surface. No OpenAPI is
      saved: the CKAN Action API is CKAN's product contract shared by every CKAN site, and crediting
      it to NCKU would be the same defect this pipeline exists to prevent. The rating drops because
      the June profile counted a vendor's discovery service and an unconfirmed repository API as
      NCKU's; the corrected footprint is one genuine open-data endpoint plus governance documents.
